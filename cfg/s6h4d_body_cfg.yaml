robot:
  name: "s6h4d"
  sample_frequency: 200.0  # Hz，轨迹规划离散频率
  joint_limits:
    lower: [-140, -60, 30, -150, -30, -180]
    upper: [180, 100, 190, 150, 120, 180]
  trajectory_mode: "quintic"
  kinematics:
    ik_mode: "Piper" # or Piper
    MDH:
      alpha: [0.0, -90.0, 0.0, -90.0, 90.0, -90.0]
      a: [0.0, 0.04, 0.2, 0.059, 0.0, 0.0]
      d: [0.123, 0.0, 0.0, 0.2, 0.0, 0.104]
      offset: [0.0, -90.0, 0.0, 0.0, 0.0, 0.0]
  dynamics: ""
  joints:
    - name: "joint1"
    - name: "joint2"
    - name: "joint3"
    - name: "joint4"
    - name: "joint5"
    - name: "joint6"
