aimrt:
  log:
    core_lvl: INFO # Trace/Debug/Info/Warn/Error/Fatal/Off
    backends:
      - type: console
  module:
    pkgs:
      - path: ./libmujoco_sim_pkg.so # 官方仿真组件
        disable_modules: []
      - path: ./libsim_proxy_pkg.so
        disable_modules: []
    modules:
      - name: MujocoSimModule # 官方仿真组件
        log_lvl: INFO
      - name: ProxyModule
        log_lvl: INFO
      - name: RvizModule
        log_lvl: INFO
  plugin:
    plugins:
      - name: ros2_plugin
        path: ./libaimrt_ros2_plugin.so
        options:
          node_name: sim_proxy_node
          executor_type: MultiThreaded
          executor_thread_num: 2
      # - name: echo_plugin
      #   path: ./libaimrt_echo_plugin.so 
      #   options:
      #     type_support_pkgs:
      #       - path: ./libsensor_pb_ts.so
      #     topic_meta_list:
      #       - topic_name: /sim/joint_state
      #         msg_type: pb:aimrt.protocols.sensor.JointStateArray
      #         echo_type: json

  executor:
    executors:
      - name: gui_executor
        type: simple_thread
      - name: work_executor
        type: asio_thread
        options:
          thread_num: 5

  channel:
    backends:
      - type: local # 官方支持local后端
        options:
          subscriber_use_inline_executor: false
          subscriber_executor: work_executor
      - type: ros2

    pub_topics_options:
      - topic_name: "(.*)" # 正则表达式
        enable_backends: [local, ros2]
        enable_filters: []
    sub_topics_options:
      - topic_name: "(.*)" # 正则表达式
        enable_backends: [local]
        enable_filters: []


# Module custom configuration
MujocoSimModule:
  simulation_model_path: ./cfg/model/GeniArm_with_table.xml
  sim_executor: work_executor
  gui_executor: gui_executor
  subscriber_options:
    - topic: /sim/joint_cmd
      type: joint_actuator
      options:
        joints:
          - name: shoulder_joint
            bind_joint: shoulder_joint
          - name: upper_arm_joint
            bind_joint: upper_arm_joint
          - name: elbow_joint
            bind_joint: elbow_joint
          - name: wrist1_joint
            bind_joint: wrist1_joint
          - name: wrist2_joint
            bind_joint: wrist2_joint
          - name: wrist3_joint
            bind_joint: wrist3_joint
  publisher_options:
    - topic: /sim/joint_state
      frequency: 100
      executor: work_executor
      type: joint_sensor
      options:
        joints:
          - name: shoulder_joint
            bind_joint: shoulder_joint
          - name: upper_arm_joint
            bind_joint: upper_arm_joint
          - name: elbow_joint
            bind_joint: elbow_joint
          - name: wrist1_joint
            bind_joint: wrist1_joint
          - name: wrist2_joint
            bind_joint: wrist2_joint
          - name: wrist3_joint
            bind_joint: wrist3_joint
ProxyModule:
  http_server_executor: work_executor
  sdk_http_joint_state_topic: /sdk/joint_state
  sdk_http_joint_cmd_topic: /sdk/joint_cmd
  sdk_http_gripper_state_topic: /sdk/gripper_state
  sdk_http_gripper_cmd_topic: /sdk/gripper_cmd
  proxy_joint_state_topic: /sim/joint_state
  proxy_joint_cmd_topic: /sim/joint_cmd
RvizModule:
  proxy_joint_state_topic: /sim/joint_state